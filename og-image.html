<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>OG image · workonyourterms.org</title>
<!-- Source for og-image.png. Regenerate with: node scripts/render-og.mjs -->
<style>
@font-face{font-family:"Bricolage Grotesque";font-style:normal;font-weight:400 800;font-display:block;src:url("fonts/BricolageGrotesque-Variable.woff2") format("woff2")}
@font-face{font-family:"Inter";font-style:normal;font-weight:400 900;font-display:block;src:url("fonts/Inter-Variable.woff2") format("woff2")}
:root{--paper:#F6F0E4;--ink:#1A1714;--tomato:#E63B2E;--tomato-deep:#B8281E;--pink:#FFB8CF;--line-soft:#D9CFBE}
*{box-sizing:border-box}
html,body{margin:0;background:var(--line-soft)}
#og{width:1200px;height:630px;background:var(--paper);color:var(--ink);position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) 310px;gap:64px;align-items:center;padding:80px 96px 80px 80px;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#og::after{content:"";position:absolute;left:0;right:0;bottom:0;height:16px;background:var(--tomato)}
.copy{display:flex;flex-direction:column;gap:30px;min-width:0}
.d{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;letter-spacing:-.035em;line-height:.98;font-variation-settings:"opsz" 96}
.wm{font-size:34px}.wm span{color:var(--tomato)}
h1{margin:0;font-size:72px;text-wrap:balance}
.hl{background:linear-gradient(transparent 20%,var(--pink) 20%,var(--pink) 90%,transparent 90%);padding:0 .08em;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.meta{display:flex;align-items:center;gap:14px;font:700 20px/1 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--tomato-deep)}
.meta i{width:8px;height:8px;border-radius:50%;background:var(--tomato-deep)}
.print{width:300px;height:375px;background:#fff;padding:12px 12px 40px;transform:rotate(3deg);box-shadow:0 2px 0 rgba(26,23,20,.12),0 18px 32px -14px rgba(26,23,20,.4)}
.print img{width:100%;height:100%;object-fit:cover;object-position:50% 30%;display:block;filter:saturate(1.05) sepia(.08)}
</style>
</head>
<body>
<div id="og">
<div class="copy">
<div class="wm d">work on your terms<span>.</span></div>
<h1 class="d">From fired 3 times to a <span class="hl">$68K/month business.</span></h1>
<div class="meta"><span>The Sunday letter</span><i></i><span>workonyourterms.org</span></div>
</div>
<div class="print"><img src="chase-headshot.jpeg" alt="Chase Cochran"></div>
</div>
</body>
</html>
